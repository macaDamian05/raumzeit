[project]
name = "raumzeit"
version = "1.1.0"
description = "Lokales Raumbuchungssystem für das SE Einzelportfolio"
requires-python = ">=3.12"
dependencies = ["Flask>=3.1,<4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["raumzeit"]
omit = ["raumzeit/__main__.py"]

[tool.coverage.report]
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "\\.\\.\\."]
